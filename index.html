<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read &amp; Learn: English Reading Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--paper:#f5f8fb;--card:#fff;--blue:#1f5fbf;--on:#fff;--sun:#ffc83d;--mint:#d5eee2;--line:#cfd9e4;--ok:#1b7f4b;--bad:#b3261e;--fs:1.15rem}
@media(prefers-color-scheme:dark){:root{--ink:#eaf0f7;--paper:#0f1b2d;--card:#172640;--blue:#7fb0ff;--on:#0f1b2d;--mint:#1d4a3a;--line:#2f4466;--ok:#6fd3a0;--bad:#ff9d94}}
body.big{--fs:1.4rem}
*{box-sizing:border-box}
html{scroll-padding-top:1rem}
body{margin:0;background:var(--paper);color:var(--ink);font:var(--fs)/1.65 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--card);border-bottom:6px solid var(--sun);padding:1rem 1.25rem}
.bar{max-width:46rem;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.brand{font-size:1.5rem;font-weight:700;color:var(--ink);text-decoration:none}
main{max-width:46rem;margin:0 auto;padding:1.5rem 1.25rem 6rem}
h1{font-size:2rem;line-height:1.2;margin:.2rem 0 .5rem}
h2{font-size:1.4rem;margin:2.2rem 0 .6rem}
button,.btn{font:inherit;cursor:pointer}
.btn{display:inline-block;background:var(--blue);color:var(--on);border:2px solid var(--blue);border-radius:.6rem;padding:.45rem .9rem;font-size:1rem;font-weight:700;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.lead{max-width:36rem}
.library{display:grid;gap:1rem;margin-top:1.5rem}
.item{display:block;background:var(--card);border:2px solid var(--line);border-radius:.8rem;padding:1rem 1.2rem;color:inherit;text-decoration:none}
.item:hover{border-color:var(--blue)}
.item strong{display:block;font-size:1.3rem}
.tag{display:inline-block;background:var(--mint);border-radius:.4rem;padding:0 .5rem;font-size:.9rem;margin-right:.4rem}
.tools{display:flex;gap:.6rem;flex-wrap:wrap;margin:.8rem 0 1.2rem}
.text p{margin:0 0 1.1rem;max-width:40rem}
.vw{font:inherit;color:inherit;background:linear-gradient(transparent 55%,var(--sun) 55%);border:0;padding:0;font-weight:700}
.vw:hover{background:var(--sun);color:#14213d}
#defbar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);padding:.9rem 1.25rem;display:none;text-align:center}
#defbar.on{display:block}
#defbar b{color:var(--sun)}
dl{margin:0}
dt{font-weight:700;margin-top:.7rem}
dd{margin:0}
.q{background:var(--card);border:2px solid var(--line);border-radius:.8rem;padding:1rem 1.2rem;margin-bottom:1rem}
.q p{margin:0 0 .6rem;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:transparent;color:inherit;border:2px solid var(--line);border-radius:.5rem;padding:.45rem .8rem;margin-top:.45rem}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{border-color:var(--ok);background:var(--mint)}
.opt.wrong{border-color:var(--bad)}
.fb{margin:.6rem 0 0;font-weight:700}
label{display:block;font-weight:700;margin-top:1rem}
textarea,input[type=text]{width:100%;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:.5rem;padding:.5rem .7rem;margin-top:.3rem}
.hint{font-size:.95rem;opacity:.85;margin:.3rem 0 0}
.sample{background:var(--mint);border-radius:.8rem;padding:1rem 1.2rem;margin-top:1rem}
.sample[hidden]{display:none}
footer{max-width:46rem;margin:0 auto;padding:0 1.25rem 4rem;font-size:.95rem;opacity:.8}
@media(prefers-reduced-motion:no-preference){.item{transition:border-color .15s}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="#">Read &amp; Learn</a>
    <button class="btn alt" id="size" type="button">Bigger text</button>
  </div>
</header>
<main id="app"></main>
<div id="defbar" role="status" aria-live="polite"></div>
<footer>Reading practice for English learners. Tap a highlighted word to see its meaning. Press Listen to hear the text.</footer>

<script>
/* ================================================================
   TO ADD AN ARTICLE: copy one block below, paste it at the end of the
   list (add a comma after the previous block), and change the words.
   - id: letters, numbers, and hyphens only (used in the web address)
   - vocab words are highlighted automatically in the text
   - quiz answer "a" is the number of the right option, starting at 0
   ================================================================ */
const ARTICLES = [
{
  id: "amphibians-reptiles",
  title: "Amphibians and Reptiles",
  level: "3rd grade",
  topic: "Animals",
  text: [
    "Frogs, snakes, turtles, and salamanders may look a little the same, but they are in two groups. Some are amphibians. Some are reptiles. All of them are cold-blooded. This means their bodies get warm in the sun and cool off in the shade.",
    "Amphibians live part of their lives in water and part on land. Frogs, toads, and salamanders are amphibians. Their skin is soft and wet. A frog starts as an egg in the water. Then it becomes a tadpole with a tail. Later, it grows legs and hops out of the water.",
    "Reptiles are different. Snakes, lizards, turtles, and crocodiles are reptiles. Their skin is dry and has hard scales. Most reptiles lay eggs on land. The Komodo dragon is the biggest lizard in the world. It can be about ten feet long!",
    "Amphibians and reptiles are important to nature. They eat bugs and small animals. Birds and other animals eat them. When we protect their homes, we help nature stay healthy."
  ],
  vocab: [
    ["amphibian", "an animal that lives part of its life in water and part on land"],
    ["reptile", "an animal with dry skin and scales"],
    ["cold-blooded", "having a body that gets warm or cool from the air or sun around it"],
    ["tadpole", "a baby frog that lives in water and has a tail"],
    ["scales", "small, hard plates that cover the skin of a reptile"],
    ["protect", "to keep safe"]
  ],
  quiz: [
    { q: "Which animal is an amphibian?", o: ["a snake", "a frog", "a turtle"], a: 1 },
    { q: "What covers a reptile’s skin?", o: ["soft fur", "hard scales", "wet feathers"], a: 1 },
    { q: "What is the biggest lizard in the world?", o: ["the frog", "the Komodo dragon", "the sea turtle"], a: 1 }
  ],
  main: "Amphibians and reptiles are two different animal groups, and both are important to nature.",
  details: [
    "Amphibians have soft, wet skin and live in water and on land.",
    "Reptiles have dry skin with scales, and most lay eggs on land.",
    "They eat bugs and small animals, and other animals eat them."
  ]
},
{
  id: "food-around-the-world",
  title: "Food Around the World",
  level: "3rd grade",
  topic: "Culture",
  text: [
    "People all over the world eat food, but the food is not the same in every country. Each place has special foods. Food can teach us about the people who live there.",
    "The food in a country depends on what grows there. Japan is next to the ocean, so people eat a lot of fish and rice. In Mexico, people grow corn and use it to make tortillas. In Italy, people make pasta and pizza with wheat, tomatoes, and cheese.",
    "Some foods are special because of spices. In India, cooks use spices to make food with a strong taste. In Ethiopia, families share one big plate. They use soft, flat bread to pick up their food.",
    "Food can travel too. When people move to a new country, they bring their favorite foods. Soon, other people want to try them. Food brings families together on holidays and birthdays."
  ],
  vocab: [
    ["country", "a place with its own land, people, and leaders"],
    ["special", "different and important"],
    ["rice", "small white or brown grains that people cook and eat"],
    ["spice", "something that adds a strong taste to food, like pepper"],
    ["share", "to give some of what you have to others"],
    ["travel", "to go from one place to another"]
  ],
  quiz: [
    { q: "What do people in Japan eat a lot?", o: ["fish and rice", "only pizza", "corn tortillas"], a: 0 },
    { q: "What do people in Ethiopia use to pick up food?", o: ["a fork", "soft, flat bread", "a spoon"], a: 1 },
    { q: "What happens when people move to a new country?", o: ["They stop eating", "They bring their favorite foods", "They cook only fish"], a: 1 }
  ],
  main: "Different countries have different special foods, and food helps us learn about people.",
  details: [
    "Food depends on what grows in a country, like fish in Japan and corn in Mexico.",
    "Spices and ways of eating make foods special, like the flat bread in Ethiopia.",
    "People bring their favorite foods when they move, and food brings families together."
  ]
},
  {
  id: "world-religions-4th",
  title: "World Religions (4th Grade)",
  level: "4th grade",
  topic: "Culture",
  text: [
    "A religion is a set of beliefs about God, gods, or the meaning of life. People all over the world follow many different religions. Religion can guide how people live, what they eat, and how they celebrate. Here are five of the world’s biggest religions.",
    "Christianity is the largest religion, with more than two billion followers. Christians believe in one God and follow the teachings of Jesus. Their holy book is the Bible. Many Christians worship in a building called a church. Two important Christian holidays are Christmas and Easter.",
    "Judaism is one of the oldest religions in the world, and it has about 15 million followers. Jewish people believe in one God. Their holy book is the Torah, and they worship in a building called a synagogue. Every week, many Jewish families rest and pray together on a day called Shabbat. Passover and Hanukkah are Jewish festivals.",
    "Islam has almost two billion followers. Muslims believe in one God, called Allah in Arabic, and they follow the teachings of the Prophet Muhammad. Their holy book is the Quran, and they worship in a building called a mosque. Many Muslims pray five times a day. During the month of Ramadan, many Muslims do not eat or drink from sunrise to sunset.",
    "Hinduism began in India thousands of years ago, and it has more than one billion followers. Hindus worship God in many forms, and many people honor gods and goddesses at home or in a temple. Hindus have many holy books, and one of the oldest is called the Vedas. Diwali, the festival of lights, is a famous Hindu holiday.",
    "Buddhism also began in India, and it has about 500 million followers. Buddhists follow the teachings of a man named Siddhartha Gautama, who is called the Buddha. Buddhists try to live in a kind and peaceful way. Many practice meditation, which means sitting quietly and calming the mind. They often visit temples.",
    "These religions have different beliefs, but many of them teach people to be kind, honest, and helpful. When we learn about the religions of others, we can understand and respect our neighbors better. There are also many other religions in the world, and some people do not follow a religion at all."
  ],
  vocab: [
    ["religion", "a set of beliefs about God, gods, or the meaning of life"],
    ["believe", "to think that something is true"],
    ["holy", "special because it is connected to God or to a religion"],
    ["prayer", "talking to God or thinking quietly about God"],
    ["worship", "to show love and respect to God or gods"],
    ["festival", "a special day or days when people celebrate together"]
  ],
  quiz: [
    { q: "What is the holy book of Islam?", o: ["the Bible", "the Torah", "the Quran"], a: 2 },
    { q: "Where did Hinduism and Buddhism begin?", o: ["China", "India", "Egypt"], a: 1 },
    { q: "What is a Jewish building for worship called?", o: ["a mosque", "a synagogue", "a church"], a: 1 },
    { q: "Which religion has the most followers?", o: ["Christianity", "Judaism", "Buddhism"], a: 0 },
    { q: "Diwali, the festival of lights, is a holiday for which religion?", o: ["Hinduism", "Buddhism", "Judaism"], a: 0 },
    { q: "Why is it good to learn about the religions of others?", o: ["It helps us understand and respect our neighbors", "It tells us which religion is best", "It is the law"], a: 0 }
  ],
  main: "There are many different religions in the world, each with its own beliefs, holy books, and celebrations, and learning about them helps us respect each other.",
  details: [
    "Christianity, Judaism, Islam, Hinduism, and Buddhism are five of the biggest religions, and they have different beliefs.",
    "Each religion has its own holy book, such as the Bible, the Torah, the Quran, and the Vedas, and its own place to worship.",
    "Each has special holidays or festivals, such as Christmas, Passover, Ramadan, and Diwali."
  ]
}
];

/* ---------------- Code below does not need to change ---------------- */
const app = document.getElementById("app");
const defbar = document.getElementById("defbar");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function markVocab(par, vocab) {
  const meanings = {};
  vocab.forEach(([w, m]) => { meanings[w.toLowerCase()] = m; });
  const re = new RegExp("\\b(" + vocab.map(v => v[0]).join("|") + ")(s)?\\b", "gi");
  return esc(par).replace(re, (all, w) =>
    '<button class="vw" type="button" data-w="' + esc(w) + '" data-m="' + esc(meanings[w.toLowerCase()]) + '">' + all + '</button>');
}

function home() {
  speechSynthesis && speechSynthesis.cancel();
  document.title = "Read & Learn: English Reading Practice";
  app.innerHTML =
    '<h1>Choose a reading</h1>' +
    '<p class="lead">Read the article, learn the new words, answer the questions, and then find the main idea.</p>' +
    '<div class="library">' +
    ARTICLES.map(a =>
      '<a class="item" href="#' + a.id + '"><strong>' + esc(a.title) + '</strong>' +
      '<span class="tag">' + esc(a.level) + '</span><span class="tag">' + esc(a.topic) + '</span></a>').join("") +
    '</div>';
}

function article(a) {
  document.title = a.title + " | Read & Learn";
  const plain = a.text.join(" ");
  app.innerHTML =
    '<a class="btn alt" href="#">Back to all readings</a>' +
    '<h1>' + esc(a.title) + '</h1>' +
    '<span class="tag">' + esc(a.level) + '</span><span class="tag">' + esc(a.topic) + '</span>' +
    '<div class="tools"><button class="btn" id="listen" type="button">Listen</button></div>' +
    '<div class="text">' + a.text.map(p => '<p>' + markVocab(p, a.vocab) + '</p>').join("") + '</div>' +
    '<h2>New words</h2><dl>' + a.vocab.map(v => '<dt>' + esc(v[0]) + '</dt><dd>' + esc(v[1]) + '</dd>').join("") + '</dl>' +
    '<h2>Check your reading</h2><div id="quiz"></div><p id="score" class="fb"></p>' +
    '<h2>Find the main idea</h2>' +
    '<label for="main">What is the main idea? Write it in your own words.</label>' +
    '<textarea id="main" rows="2"></textarea>' +
    '<label for="d1">Detail 1</label><input type="text" id="d1">' +
    '<label for="d2">Detail 2</label><input type="text" id="d2">' +
    '<label for="d3">Detail 3</label><input type="text" id="d3">' +
    '<p class="hint">Sentence frames: The main idea is ___. One detail is ___. Another detail is ___.</p>' +
    '<p><button class="btn" id="show" type="button">Show a sample answer</button></p>' +
    '<div class="sample" id="sample" hidden><p><b>Main idea:</b> ' + esc(a.main) + '</p><ul>' +
    a.details.map(d => '<li>' + esc(d) + '</li>').join("") + '</ul></div>';

  const lb = document.getElementById("listen");
  lb.onclick = () => {
    if (!("speechSynthesis" in window)) { alert("This browser cannot read aloud."); return; }
    if (speechSynthesis.speaking) { speechSynthesis.cancel(); lb.textContent = "Listen"; return; }
    const u = new SpeechSynthesisUtterance(plain);
    u.lang = "en-US"; u.rate = 0.85;
    u.onend = () => { lb.textContent = "Listen"; };
    speechSynthesis.speak(u); lb.textContent = "Stop";
  };

  app.querySelectorAll(".vw").forEach(b => b.onclick = () => {
    defbar.innerHTML = "<b>" + b.dataset.w + "</b>: " + b.dataset.m;
    defbar.className = "on";
  });

  let right = 0, done = 0;
  const quiz = document.getElementById("quiz");
  a.quiz.forEach((item, i) => {
    const box = document.createElement("div");
    box.className = "q";
    box.innerHTML = "<p>" + (i + 1) + ". " + esc(item.q) + "</p>";
    item.o.forEach((text, j) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "opt"; b.textContent = text;
      b.onclick = () => {
        box.querySelectorAll(".opt").forEach(x => x.disabled = true);
        const ok = j === item.a;
        b.classList.add(ok ? "right" : "wrong");
        if (!ok) box.querySelectorAll(".opt")[item.a].classList.add("right");
        const fb = document.createElement("p");
        fb.className = "fb"; fb.textContent = ok ? "Correct!" : "Not quite. The right answer is highlighted.";
        box.appendChild(fb);
        done++; if (ok) right++;
        if (done === a.quiz.length) document.getElementById("score").textContent = "You got " + right + " out of " + a.quiz.length + ".";
      };
      box.appendChild(b);
    });
    quiz.appendChild(box);
  });

  document.getElementById("show").onclick = () => { document.getElementById("sample").hidden = false; };
}

function route() {
  defbar.className = "";
  window.scrollTo(0, 0);
  const id = location.hash.slice(1);
  const a = ARTICLES.find(x => x.id === id);
  if (speechSynthesis) speechSynthesis.cancel();
  a ? article(a) : home();
}

document.getElementById("size").onclick = e => {
  document.body.classList.toggle("big");
  e.target.textContent = document.body.classList.contains("big") ? "Smaller text" : "Bigger text";
};
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
